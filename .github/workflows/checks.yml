# Type check, lint and build on every pull request. The MCP editor's publish_changes refuses to
# merge a change until these pass (alongside Vercel's preview build).
name: checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to a change cancels its older run still in progress.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Same npm major (11) that writes package-lock.json; npm 10 on Node 22 rejected the
          # lock file (fdir's picomatch peer range) and failed every change before any check ran.
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
