<title id="t">The bargain, drawn</title>
<desc id="d">A violet data hall at the center of a ring of eleven neighborhood houses. A line runs from the hall to each house and carries one orange square, the cost of connecting. A twelfth house sits outside the ring with a dashed outline and no line, a neighbor left out of the bargain.</desc>
